<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gravity Flip - Endless Runner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #090d16;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-wrapper {
      width: 100%;
      max-width: 820px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hud span {
      color: #00f0ff;
    }

    .level-badge {
      background: linear-gradient(135deg, #ff007a, #7928ca);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff !important;
    }

    canvas {
      width: 100%;
      height: auto;
      background: radial-gradient(circle at center, #11192e 0%, #070a12 100%);
      border: 2px solid #1e2d4a;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.12);
      cursor: pointer;
      touch-action: manipulation;
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #8fa3bf;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="hud">
      <div>SCORE: <span id="scoreEl">0</span></div>
      <div class="level-badge" id="levelEl">LEVEL 1</div>
      <div>BEST: <span id="bestEl">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="360"></canvas>

    <div class="controls-hint">
      Tap Screen / Click / Press <strong>SPACE</strong> or <strong>UP/DOWN</strong> to Flip Gravity
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("scoreEl");
    const bestEl = document.getElementById("bestEl");
    const levelEl = document.getElementById("levelEl");

    // Track boundaries
    const TOP_TRACK = 55;
    const BOTTOM_TRACK = canvas.height - 55;

    // Game State
    let gameState = "START"; // START, PLAYING, GAMEOVER
    let score = 0;
    let bestScore = Number(localStorage.getItem("gravity_flip_best")) || 0;
    let level = 1;
    let baseSpeed = 5.2;
    let speed = baseSpeed;
    let frameCount = 0;

    bestEl.textContent = Math.floor(bestScore);

    // Player Object
    const player = {
      x: 130,
      y: BOTTOM_TRACK - 16,
      radius: 15,
      vy: 0,
      gravityDir: 1, // 1 = bottom, -1 = top
      trail: [],
      color: "#00f0ff"
    };

    let obstacles = [];
    let shards = [];
    let particles = [];
    let bgStars = Array.from({ length: 45 }, () => ({
      x: Math.random() * canvas.width,
      y: TOP_TRACK + Math.random() * (BOTTOM_TRACK - TOP_TRACK),
      size: Math.random() * 2 + 0.5,
      speedFactor: Math.random() * 0.4 + 0.1
    }));

    function resetGame() {
      score = 0;
      level = 1;
      speed = baseSpeed;
      frameCount = 0;
      obstacles = [];
      shards = [];
      particles = [];
      player.y = BOTTOM_TRACK - player.radius;
      player.vy = 0;
      player.gravityDir = 1;
      player.trail = [];
      gameState = "PLAYING";
      updateHUD();
    }

    function flipGravity() {
      if (gameState === "START" || gameState === "GAMEOVER") {
        resetGame();
        return;
      }

      player.gravityDir *= -1;
      player.vy = player.gravityDir * 14.5;
      createParticles(player.x, player.y, "#00f0ff", 10);
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color
        });
      }
    }

    function spawnObstacle() {
      const onTop = Math.random() < 0.5;
      const isMoving = level >= 3 && Math.random() < 0.3;

      if (isMoving) {
        // Floating moving laser block in middle
        obstacles.push({
          type: "block",
          x: canvas.width + 30,
          y: TOP_TRACK + 55 + Math.random() * 110,
          width: 24,
          height: 55,
          vy: (Math.random() < 0.5 ? 1 : -1) * (1.2 + level * 0.15)
        });
      } else {
        // Spike on top or bottom track
        const spikeWidth = 28 + Math.min(level * 1.5, 16);
        const spikeHeight = 34 + Math.min(level * 2, 22);
        obstacles.push({
          type: "spike",
          onTop,
          x: canvas.width + 30,
          y: onTop ? TOP_TRACK : BOTTOM_TRACK,
          width: spikeWidth,
          height: spikeHeight
        });
      }

      // Chance to spawn an energy shard opposite to the obstacle
      if (Math.random() < 0.65) {
        shards.push({
          x: canvas.width + 45,
          y: onTop ? BOTTOM_TRACK - 32 : TOP_TRACK + 32,
          radius: 9,
          pulse: 0
        });
      }
    }

    function updateHUD() {
      scoreEl.textContent = Math.floor(score);
      levelEl.textContent = "LEVEL " + level;
      if (score > bestScore) {
        bestScore = Math.floor(score);
        bestEl.textContent = bestScore;
        localStorage.setItem("gravity_flip_best", bestScore);
      }
    }

    function checkCircleRectCollision(cx, cy, r, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < (r - 3) * (r - 3);
    }

    function update() {
      frameCount++;

      // Move background stars
      bgStars.forEach((star) => {
        star.x -= (gameState === "PLAYING" ? speed : 1.5) * star.speedFactor;
        if (star.x < 0) star.x = canvas.width;
      });

      // Update particles
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
      });
      particles = particles.filter((p) => p.life > 0);

      if (gameState !== "PLAYING") return;

      // Score and Unlimited Level Progression
      score += 0.18 + level * 0.02;
      const newLevel = Math.floor(score / 250) + 1;
      if (newLevel > level) {
        level = newLevel;
        speed = baseSpeed + (level - 1) * 0.65;
        createParticles(player.x, player.y, "#ff007a", 20);
      }
      updateHUD();

      // Player Physics
      player.vy += player.gravityDir * 1.15;
      player.y += player.vy;

      // Clamp to tracks
      if (player.y + player.radius >= BOTTOM_TRACK) {
        player.y = BOTTOM_TRACK - player.radius;
        player.vy = 0;
      }
      if (player.y - player.radius <= TOP_TRACK) {
        player.y = TOP_TRACK + player.radius;
        player.vy = 0;
      }

      // Player trail
      player.trail.push({ x: player.x, y: player.y });
      if (player.trail.length > 12) player.trail.shift();

      // Spawn obstacles dynamically based on level speed
      const spawnInterval = Math.max(42, Math.floor(95 - level * 4));
      if (frameCount % spawnInterval === 0) {
        spawnObstacle();
      }

      // Update Obstacles & Collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        if (obs.type === "block") {
          obs.y += obs.vy;
          if (obs.y <= TOP_TRACK + 10 || obs.y + obs.height >= BOTTOM_TRACK - 10) {
            obs.vy *= -1;
          }

          if (checkCircleRectCollision(player.x, player.y, player.radius, obs.x, obs.y, obs.width, obs.height)) {
            triggerGameOver();
          }
        } else {
          // Forgiving hitbox for spike
          const hitX = obs.x + 6;
          const hitW = obs.width - 12;
          const hitH = obs.height - 6;
          const hitY = obs.onTop ? obs.y : obs.y - hitH;

          if (checkCircleRectCollision(player.x, player.y, player.radius, hitX, hitY, hitW, hitH)) {
            triggerGameOver();
          }
        }

        if (obs.x + 60 < 0) obstacles.splice(i, 1);
      }

      // Update Shards
      for (let i = shards.length - 1; i >= 0; i--) {
        const s = shards[i];
        s.x -= speed;
        s.pulse += 0.12;

        const dx = player.x - s.x;
        const dy = player.y - s.y;
        if (Math.hypot(dx, dy) < player.radius + s.radius + 4) {
          score += 35;
          createParticles(s.x, s.y, "#ffd700", 14);
          shards.splice(i, 1);
          updateHUD();
          continue;
        }

        if (s.x < -20) shards.splice(i, 1);
      }
    }

    function triggerGameOver() {
      gameState = "GAMEOVER";
      createParticles(player.x, player.y, "#ff2a6d", 30);
      updateHUD();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      bgStars.forEach((star) => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Top & Bottom Neon Tracks
      ctx.strokeStyle = "#00f0ff";
      ctx.lineWidth = 3;
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#00f0ff";

      ctx.beginPath();
      ctx.moveTo(0, TOP_TRACK);
      ctx.lineTo(canvas.width, TOP_TRACK);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, BOTTOM_TRACK);
      ctx.lineTo(canvas.width, BOTTOM_TRACK);
      ctx.stroke();

      ctx.shadowBlur = 0;

      // Draw Shards
      shards.forEach((s) => {
        const glowRadius = s.radius + Math.sin(s.pulse) * 2;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.pulse * 0.5);
        ctx.fillStyle = "#ffd700";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ffd700";
        ctx.fillRect(-glowRadius / 1.4, -glowRadius / 1.4, glowRadius * 1.4, glowRadius * 1.4);
        ctx.restore();
      });

      // Draw Obstacles
      obstacles.forEach((obs) => {
        ctx.fillStyle = "#ff2a6d";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff2a6d";

        if (obs.type === "block") {
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        } else {
          ctx.beginPath();
          if (obs.onTop) {
            ctx.moveTo(obs.x, obs.y);
            ctx.lineTo(obs.x + obs.width / 2, obs.y + obs.height);
            ctx.lineTo(obs.x + obs.width, obs.y);
          } else {
            ctx.moveTo(obs.x, obs.y);
            ctx.lineTo(obs.x + obs.width / 2, obs.y - obs.height);
            ctx.lineTo(obs.x + obs.width, obs.y);
          }
          ctx.closePath();
          ctx.fill();
        }
      });
      ctx.shadowBlur = 0;

      // Player Trail
      player.trail.forEach((t, idx) => {
        const alpha = (idx + 1) / player.trail.length;
        ctx.fillStyle = `rgba(0, 240, 255, ${alpha * 0.35})`;
        ctx.beginPath();
        ctx.arc(t.x - (player.trail.length - idx) * 2.5, t.y, player.radius * alpha * 0.85, 0, Math.PI * 2);
        ctx.fill();
      });

      // Player Orb
      if (gameState !== "GAMEOVER") {
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 16;
        ctx.shadowColor = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // Inner core
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Particles
      particles.forEach((p) => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, 4, 4);
      });
      ctx.globalAlpha = 1;

      // Overlay Screens
      if (gameState === "START") {
        drawOverlay("GRAVITY FLIP", "Tap or Press SPACE to Start");
      } else if (gameState === "GAMEOVER") {
        drawOverlay("GAME OVER", `Final Score: ${Math.floor(score)}  |  Tap or Press SPACE to Retry`);
      }
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "rgba(7, 10, 18, 0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 36px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 12);

      ctx.fillStyle = "#00f0ff";
      ctx.font = "18px Segoe UI, sans-serif";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 26);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Input Listeners (Mouse, Touch, Keyboard)
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      flipGravity();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") {
        e.preventDefault();
        flipGravity();
      }
    });

    gameLoop();
  </script>
</body>
</html>
