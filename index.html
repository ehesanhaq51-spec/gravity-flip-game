<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gravity Flip Pro - Unlimited</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .top-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(5, 8, 17, 0.85), rgba(5, 8, 17, 0));
    }

    .hud-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pill {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
    }

    .pill span {
      color: #00f0ff;
    }

    .level-pill {
      background: linear-gradient(135deg, #ff007a, #7928ca);
      border: none;
      color: #fff;
    }

    .sound-btn {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .shield-indicator {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      background: rgba(0, 168, 255, 0.2);
      border: 1px solid #00a8ff;
      color: #7dd3fc;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .shield-indicator.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="top-hud">
    <div class="hud-group">
      <div class="pill">SCORE <span id="scoreEl">0</span></div>
      <div class="pill level-pill" id="levelEl">LV 1</div>
    </div>
    <div class="hud-group">
      <div class="pill">BEST <span id="bestEl">0</span></div>
      <button class="sound-btn" id="soundBtn">🔊 ON</button>
    </div>
  </div>

  <div class="shield-indicator" id="shieldBadge">🛡️ SHIELD ACTIVE</div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("scoreEl");
    const bestEl = document.getElementById("bestEl");
    const levelEl = document.getElementById("levelEl");
    const soundBtn = document.getElementById("soundBtn");
    const shieldBadge = document.getElementById("shieldBadge");

    // --- Procedural Web Audio Synthesizer ---
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playTone(freqStart, freqEnd, duration, type = "sine", gainVal = 0.12) {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), now + duration);

      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    soundBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 ON" : "🔇 OFF";
    });

    // --- Responsive Full-Screen Setup ---
    let width = window.innerWidth;
    let height = window.innerHeight;
    let topTrack = 115;
    let bottomTrack = height - 95;
    let gridOffset = 0;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      topTrack = Math.max(105, Math.min(145, height * 0.16));
      bottomTrack = Math.min(height - 85, height - Math.max(90, height * 0.13));

      player.x = Math.min(115, width * 0.22);
      if (player.y + player.radius > bottomTrack) {
        player.y = bottomTrack - player.radius;
      }
      if (player.y - player.radius < topTrack) {
        player.y = topTrack + player.radius;
      }
    }

    // --- Game Variables ---
    let gameState = "START"; // START, PLAYING, GAMEOVER
    let score = 0;
    let bestScore = Number(localStorage.getItem("gravity_flip_pro_best")) || 0;
    let level = 1;
    let speed = 5.5;
    let frameCount = 0;
    let shakeTime = 0;
    let flashAlpha = 0;
    let levelBannerTimer = 0;

    bestEl.textContent = Math.floor(bestScore);

    const player = {
      x: 100,
      y: 300,
      radius: 16,
      vy: 0,
      gravityDir: 1, // 1 = down, -1 = up
      hasShield: false,
      trail: [],
      rotation: 0
    };

    let obstacles = [];
    let collectibles = []; // shards & shields
    let particles = [];
    let floatingTexts = [];

    const stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * 1000,
      y: Math.random() * 1000,
      r: Math.random() * 2 + 0.6,
      speed: Math.random() * 0.5 + 0.15,
      alpha: Math.random() * 0.5 + 0.2
    }));

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function setShield(active) {
      player.hasShield = active;
      shieldBadge.classList.toggle("active", active);
    }

    function resetGame() {
      initAudio();
      score = 0;
      level = 1;
      speed = Math.max(5.2, width * 0.013);
      frameCount = 0;
      shakeTime = 0;
      flashAlpha = 0;
      levelBannerTimer = 0;
      obstacles = [];
      collectibles = [];
      particles = [];
      floatingTexts = [];
      player.y = bottomTrack - player.radius;
      player.vy = 0;
      player.gravityDir = 1;
      player.trail = [];
      setShield(false);
      gameState = "PLAYING";
      updateHUD();
      playTone(320, 640, 0.14, "triangle", 0.12);
    }

    function flipGravity() {
      initAudio();
      if (gameState === "START" || gameState === "GAMEOVER") {
        resetGame();
        return;
      }

      player.gravityDir *= -1;
      player.vy = player.gravityDir * Math.max(13, height * 0.019);
      flashAlpha = 0.08;
      createParticles(player.x, player.y, "#00f0ff", 12);
      playTone(
        player.gravityDir === -1 ? 360 : 540,
        player.gravityDir === -1 ? 680 : 280,
        0.11,
        "sine",
        0.11
      );
    }

    function addFloatingText(x, y, text, color = "#ffd700") {
      floatingTexts.push({ x, y, text, color, life: 1 });
    }

    function createParticles(x, y, color, count, spread = 6.5) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * spread,
          vy: (Math.random() - 0.5) * spread,
          size: Math.random() * 4 + 2,
          life: 1,
          color
        });
      }
    }

    function spawnPattern() {
      const trackSpan = bottomTrack - topTrack;
      const difficultyBoost = Math.min(level * 0.05, 0.65);
      const roll = Math.random();

      // Gradual introduction of harder obstacle types by level
      if (level >= 5 && roll < 0.24) {
        // Pulsing Laser Hazard (toggles active/warning)
        const yPos = topTrack + trackSpan * (0.28 + Math.random() * 0.44);
        obstacles.push({
          type: "pulse",
