<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gravity Flip PRO v4</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
      position: fixed;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .top-hud {
      position: fixed;
      top: env(safe-area-inset-top);
      left: 0;
      width: 100%;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(5, 8, 17, 0.9), rgba(5, 8, 17, 0));
    }

    .hud-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill span {
      color: #00f0ff;
    }

    .level-pill {
      background: linear-gradient(135deg, #ff007a, #7928ca);
      border: none;
      color: #fff;
    }

    .pro-badge {
      background: rgba(0, 240, 255, 0.16);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    .ctrl-btn {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .status-row {
      position: fixed;
      top: 56px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .badge-status {
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .badge-status.active {
      opacity: 1;
    }

    .shield-badge {
      background: rgba(56, 189, 248, 0.22);
      border: 1px solid #38bdf8;
      color: #bae6fd;
    }

    .x2-badge {
      background: rgba(250, 204, 21, 0.22);
      border: 1px solid #facc15;
      color: #fef08a;
    }
  </style>
</head>
<body>
  <div class="top-hud">
    <div class="hud-group">
      <div class="pill">SCORE <span id="scoreEl">0</span></div>
      <div class="pill level-pill" id="levelEl">LV 1</div>
      <div class="pro-badge">PRO v4</div>
    </div>
    <div class="hud-group">
      <div class="pill">BEST <span id="bestEl">0</span></div>
      <button class="ctrl-btn" id="zoomResetBtn">🔍 1.0x</button>
      <button class="ctrl-btn" id="soundBtn">🔊 ON</button>
    </div>
  </div>

  <div class="status-row">
    <div class="badge-status shield-badge" id="shieldBadge">🛡️ SHIELD</div>
    <div class="badge-status x2-badge" id="x2Badge">⚡ 2X SCORE</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("scoreEl");
    const bestEl = document.getElementById("bestEl");
    const levelEl = document.getElementById("levelEl");
    const soundBtn = document.getElementById("soundBtn");
    const zoomResetBtn = document.getElementById("zoomResetBtn");
    const shieldBadge = document.getElementById("shieldBadge");
    const x2Badge = document.getElementById("x2Badge");

    // --- Sound ---
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    function playTone(freqStart, freqEnd, duration, type, gainVal) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freqStart, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(45, freqEnd), now + duration);
        gain.gain.setValueAtTime(gainVal || 0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    soundBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 ON" : "🔇 OFF";
    });

    // --- User Pinch Zoom & Pan ---
    let zoomScale = 1.0;
    let camX = 0;
    let camY = 0;
    const minZoom = 0.65;
    const maxZoom = 2.0;

    function updateZoomLabel() {
      zoomResetBtn.textContent = "🔍 " + zoomScale.toFixed(1) + "x";
    }

    zoomResetBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      zoomScale = 1.0;
      camX = 0;
      camY = 0;
      updateZoomLabel();
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      zoomScale = Math.max(minZoom, Math.min(maxZoom, zoomScale + delta));
      updateZoomLabel();
    }, { passive: false });

    // --- Game Dimensions ---
    let width, height, topTrack, bottomTrack;
    let gridOffset = 0;

    let gameState = "START";
    let score = 0;
    let bestScore = Number(localStorage.getItem("gravity_flip_v4_best")) || 0;
    let level = 1;
    let speed = 6.2;
    let frameCount = 0;
    let shakeTime = 0;
    let flashAlpha = 0;
    let doubleScoreTimer = 0;

    bestEl.textContent = Math.floor(bestScore);

    const player = {
      x: 95,
      y: 300,
      radius: 17,
      vy: 0,
      gravityDir: 1,
      hasShield: false,
      trail: [],
      rotation: 0,
      ringPulse: 0
    };

    let obstacles = [];
    let collectibles = [];
    let particles = [];
    let floatingTexts = [];

    const stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * 1200,
        y: Math.random() * 1200,
        r: Math.random() * 2.2 + 0.5,
        speed: Math.random() * 0.5 + 0.15,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      topTrack = Math.max(115, height * 0.16);
      bottomTrack = Math.min(height - 85, height - Math.max(95, height * 0.13));

      player.x = Math.min(105, width * 0.22);
      if (player.y + player.radius > bottomTrack) player.y = bottomTrack - player.radius;
      if (player.y - player.radius < topTrack) player.y = topTrack + player.radius;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setShield(active) {
      player.hasShield = active;
      shieldBadge.classList.toggle("active", active);
    }

    function setDoubleScore(active) {
      x2Badge.classList.toggle("active", active);
    }

    function resetGame() {
      initAudio();
      score = 0;
      level = 1;
      speed = Math.max(6.0, height * 0.016);
      frameCount = 0;
      shakeTime = 0;
      flashAlpha = 0;
      doubleScoreTimer = 0;
      setDoubleScore(false);
      obstacles = [];
      collectibles = [];
      particles = [];
      floatingTexts = [];
      player.y = bottomTrack - player.radius;
      player.vy = 0;
      player.gravityDir = 1;
      player.trail = [];
      setShield(false);
      gameState = "PLAYING";
      updateHUD();
      playTone(350, 720, 0.13, "triangle", 0.12);
    }

    function flipGravity() {
      initAudio();
      if (gameState === "START" || gameState === "GAMEOVER") {
        resetGame();
        return;
      }
      player.gravityDir *= -1;
      player.vy = player.gravityDir * Math.max(15, height * 0.024);
      flashAlpha = 0.08;
      createParticles(player.x, player.y, "#00f0ff", 14, 7.5);
      createParticles(player.x, player.y, "#ff007a", 6, 5.5);
      playTone(
        player.gravityDir === -1 ? 380 : 560,
        player.gravityDir === -1 ? 720 : 290,
        0.11,
        "sine",
        0.12
      );
    }

    function createParticles(x, y, color, count, spread) {
      const sp = spread || 7;
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * sp,
          vy: (Math.random() - 0.5) * sp,
          size: Math.random() * 4.5 + 2,
          life: 1,
          color
        });
      }
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({
        x, y, text,
        color: color || "#ffd700",
        life: 1
      });
    }

    // Harder & More Varied Patterns
    function spawnPattern() {
      const trackSpan = Math.max(140, bottomTrack - topTrack);
      const roll = Math.random();

      // Pattern 1: Alternating Top & Bottom Zig-Zag Spikes (from Level 1+)
      if (roll < 0.28) {
        const count = level >= 3 ? 3 : 2;
        const spikeW = Math.min(46, 32 + level * 1.1);
        const spikeH = Math.min(72, 42 + level * 1.8);
        let startTop = Math.random() < 0.5;
        for (let c = 0; c < count; c++) {
          const onTop = c % 2 === 0 ? startTop : !startTop;
          obstacles.push({
            type: "spike",
            onTop,
            x: width + 45 + c * (spikeW + 46),
            y: onTop ? topTrack : bottomTrack,
            w: spikeW,
            h: spikeH
          });
        }
      }
      // Pattern 2: Twin Gate (Top & Bottom spike pair with tight middle window, Level 2+)
      else if (level >= 2 && roll < 0.52) {
        const spikeW = Math.min(44, 30 + level);
        const spikeH = Math.min(64, 38 + level * 1.5);
        const xPos = width + 50;
        obstacles.push({
          type: "spike",
          onTop: true,
