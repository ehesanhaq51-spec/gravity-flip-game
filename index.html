<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gravity Flip Synth v6</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120624;
      color: #fdf4ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
      position: fixed;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud-top {
      position: fixed;
      top: env(safe-area-inset-top);
      left: 0;
      width: 100%;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(18, 6, 36, 0.92), rgba(18, 6, 36, 0));
    }

    .hud-box {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(36, 12, 66, 0.88);
      border: 1px solid rgba(244, 114, 182, 0.55);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .chip span {
      color: #f472b6;
    }

    .lv-chip {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: none;
      color: #ffffff;
    }

    .ver-chip {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
    }

    .action-btn {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(36, 12, 66, 0.95);
      border: 1px solid rgba(244, 114, 182, 0.6);
      color: #fdf4ff;
      padding: 5px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .buff-bar {
      position: fixed;
      top: 56px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .buff-tag {
      padding: 3px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .buff-tag.active {
      opacity: 1;
    }

    .buff-shield {
      background: rgba(56, 189, 248, 0.22);
      border: 1px solid #38bdf8;
      color: #bae6fd;
    }

    .buff-x2 {
      background: rgba(251, 191, 36, 0.22);
      border: 1px solid #fbbf24;
      color: #fde68a;
    }
  </style>
</head>
<body>
  <div class="hud-top">
    <div class="hud-box">
      <div class="chip">SCORE <span id="scoreEl">0</span></div>
      <div class="chip lv-chip" id="levelEl">LV 1</div>
      <div class="ver-chip">SYNTH v6</div>
    </div>
    <div class="hud-box">
      <div class="chip">BEST <span id="bestEl">0</span></div>
      <button class="action-btn" id="zoomBtn">🔍 0.7x</button>
      <button class="action-btn" id="soundBtn">🔊</button>
    </div>
  </div>

  <div class="buff-bar">
    <div class="buff-tag buff-shield" id="shieldEl">🛡️ SHIELD</div>
    <div class="buff-tag buff-x2" id="x2El">⚡ 2X</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("scoreEl");
    const bestEl = document.getElementById("bestEl");
    const levelEl = document.getElementById("levelEl");
    const zoomBtn = document.getElementById("zoomBtn");
    const soundBtn = document.getElementById("soundBtn");
    const shieldEl = document.getElementById("shieldEl");
    const x2El = document.getElementById("x2El");

    // --- Audio ---
    let soundOn = true;
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function beep(f1, f2, dur, type, vol) {
      if (!soundOn || !audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || "sawtooth";
        osc.frequency.setValueAtTime(f1, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(45, f2), t + dur);
        gain.gain.setValueAtTime(vol || 0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur);
      } catch (e) {}
    }

    soundBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? "🔊" : "🔇";
    });

    // --- Zoom & Pan ---
    let zoom = 1.0;
    let panX = 0;
    let panY = 0;
    const MIN_ZOOM = 0.65;
    const MAX_ZOOM = 2.0;

    function syncZoomBtn() {
      zoomBtn.textContent = "🔍 " + zoom.toFixed(1) + "x";
    }

    zoomBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      zoom = 0.7;
      panX = 0;
      panY = 0;
      syncZoomBtn();
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom + (e.deltaY < 0 ? 0.1 : -0.1)));
      syncZoomBtn();
    }, { passive: false });

    // --- Dimensions & State ---
    let W = 360, H = 640, topRail = 120, botRail = 540;
    let railScroll = 0;

    let state = "START";
    let score = 0;
    let best = Number(localStorage.getItem("gf_synth_v6_best")) || 0;
    let level = 1;
    let speed = 6.2;
    let tick = 0;
    let shake = 0;
    let flash = 0;
    let x2Timer = 0;

    bestEl.textContent = Math.floor(best);

    const ship = {
      x: 95,
      y: 320,
      r: 17,
      vy: 0,
      dir: 1,
      shield: false,
      spin: 0,
      tail: []
    };

    let hazards = [];
    let pickups = [];
    let sparks = [];
    let popups = [];

    const stars = [];
    for (let i = 0; i < 85; i++) {
      stars.push({
        x: Math.random() * 1200,
        y: Math.random() * 1200,
        s: Math.random() * 2 + 0.6,
        spd: Math.random() * 0.4 + 0.15,
        a: Math.random() * 0.6 + 0.2
      });
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      topRail = Math.max(115, H * 0.16);
      botRail = Math.min(H - 85, H - Math.max(95, H * 0.13));

      ship.x = Math.min(105, W * 0.22);
      if (ship.y + ship.r > botRail) ship.y = botRail - ship.r;
      if (ship.y - ship.r < topRail) ship.y = topRail + ship.r;
    }

    window.addEventListener("resize", resize);
    resize();

    function setShieldUI(v) {
      ship.shield = v;
      shieldEl.classList.toggle("active", v);
    }

    function setX2UI(v) {
      x2El.classList.toggle("active", v);
    }

    function updateHUD() {
      scoreEl.textContent = Math.floor(score);
      levelEl.textContent = "LV " + level;
      if (score > best) {
        best = Math.floor(score);
        bestEl.textContent = best;
        try { localStorage.setItem("gf_synth_v6_best", best); } catch (e) {}
      }
    }

    function spawnSparks(x, y, color, n, spread) {
      const sp = spread || 7;
      for (let i = 0; i < n; i++) {
        sparks.push({
          x, y,
          vx: (Math.random() - 0.5) * sp,
          vy: (Math.random() - 0.5) * sp,
          sz: Math.random() * 4.5 + 2,
          life: 1,
          color
        });
      }
    }

    function addPopup(x, y, txt, color) {
      popups.push({ x, y, txt, color: color || "#fde047", life: 1 });
    }

    function startNewRun() {
      initAudio();
      score = 0;
      level = 1;
      speed = Math.max(6.0, H * 0.016);
      tick = 0;
      shake = 0;
      flash = 0;
      x2Timer = 0;
      setX2UI(false);
      setShieldUI(false);
      hazards = [];
      pickups = [];
      sparks = [];
      popups = [];
      ship.y = botRail - ship.r;
      ship.vy = 0;
      ship.dir = 1;
      ship.tail = [];
      state = "PLAYING";
      updateHUD();
      beep(320, 680, 0.13, "triangle", 0.11);
    }

    function flipDir() {
      initAudio();
      if (state === "START" || state === "OVER") {
        startNewRun();
        return;
      }
      ship.dir *= -1;
      ship.vy = ship.dir * Math.max(15, H * 0.024);
      flash = 0.07;
      spawnSparks(ship.x, ship.y, "#f472b6", 12, 7);
      spawnSparks(ship.x, ship.y, "#38bdf8", 6, 5);
      beep(ship.dir === -1 ? 380 : 560, ship.dir === -1 ? 720 : 280, 0.11, "sine", 0.11);
    }

    function spawnWave() {
      const span = Math.max(140, botRail - topRail);
      const r = Math.random();

      if (r < 0.28) {
        const count = level >= 3 ? 3 : 2;
        const w = Math.min(44, 30 + level * 1.1);
        const h = Math.min(70, 40 + level * 1.8);
        const firstTop = Math.random() < 0.5;
        for (let i = 0; i < count; i++) {
          const top = i % 2 === 0 ? firstTop : !firstTop;
          hazards.push({
            kind: "blade",
            top,
            x: W + 45 + i * (w + 44),
            y: top ? topRail : botRail,
            w, h
          });
        }
      } else if (level >= 2 && r < 0.54) {
        const w = Math.min(42, 28 + level);
        const h = Math.min(62, 36 + level * 1.5);
        const x0 = W + 50;
        hazards.push({ kind: "blade", top: true, x: x0, y: topRail, w, h });
        hazards.push({ kind: "blade", top: false, x: x0 + 26, y: botRail, w, h });
      } else if (level >= 2 && r < 0.78) {
        const h = Math.min(76, span * 0.16);
        hazards.push({
          kind: "mover",
          x: W + 50,
          y: topRail + 30 + Math.random() * Math.max(25, span - h - 60),
          w: 28, h,
          vy: (Math.random() < 0.5 ? 1 : -1) * (2.1 + level * 0.25),
          minY: topRail + 12,
          maxY: botRail - h - 12
        });
      } else if (level >= 3) {
        hazards.push({
          kind: "laser",
          x: W + 50,
          y: topRail + span * (0.26 + Math.random() * 0.48),
          w: 22,
          h: Math.min(120, span * 0.24),
          phase: Math.random() * Math.PI * 2,
          hot: true
        });
      } else {
        const top = Math.random() < 0.5;
        hazards.push({
          kind: "blade",
          top,
          x: W + 45,
          y: top ? topRail : botRail,
          w: 36, h: 46
        });
      }

      if (Math.random() < 0.78) {
        const pick = Math.random();
        let type = "gem";
        if (!ship.shield && level >= 2 && pick < 0.11) type = "shield";
        else if (x2Timer <= 0 && level >= 2 && pick < 0.21) type = "x2";

        pickups.push({
          type,
          x: W + 75,
          y: Math.random() < 0.5 ? topRail + 42 : botRail - 42,
          r: type === "gem" ? 10 : 13,
          p: Math.random() * Math.PI * 2
        });
      }
    }

    function hitCircleRect(cx, cy, cr, rx, ry, rw, rh) {
      const nx = Math.max(rx, Math.min(cx, rx + rw));
      const ny = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nx;
      const dy = cy - ny;
      return dx * dx + dy * dy < (cr - 3.5) * (cr - 3.5);
    }

    function onHazardHit(idx) {
      if (ship.shield) {
        setShieldUI(false);
        shake = 11;
        flash = 0.16;
        const h = hazards[idx];
        spawnSparks(h ? h.x : ship.x, ship.y, "#38bdf8", 24, 8.5);
        addPopup(ship.x, ship.y - 24, "SHIELD SAVED!", "#38bdf8");
        beep(240, 560, 0.22, "square", 0.09);
        if (h) hazards.splice(idx, 1);
        return;
      }
      state = "OVER";
      shake = 18;
      flash = 0.25;
      spawnSparks(ship.x, ship.y, "#f43f5e", 42, 9.5);
      beep(320, 55, 0.38, "sawtooth", 0.14);
      updateHUD();
    }

    function update() {
      tick++;
      const activeSpd = state === "PLAYING" ? speed : 1.8;
      railScroll = (railScroll + activeSpd) % 36;

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x -= activeSpd * s.spd;
        if (s.x < -10) {
          s.x = W + 10;
          s.y = topRail + Math.random() * Math.max(40, botRail - topRail);
        }
      }

      if (shake > 0) shake--;
      if (flash > 0) flash = Math.max(0, flash - 0.012);
      if (x2Timer > 0) {
        x2Timer--;
        if (x2Timer === 0) setX2UI(false);
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.life -= 0.035;
        if (s.life <= 0) sparks.splice(i, 1);
      }

      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.y -= 1.2; p.life -= 0.024;
        if (p.life <= 0) popups.splice(i, 1);
      }

      if (state !== "PLAYING") return;

      const mult = x2Timer > 0 ? 2 : 1;
      score += (0.25 + level * 0.035) * mult;

      const nextLv = Math.floor(score / 320) + 1;
      if (nextLv > level) {
        level = nextLv;
        speed = Math.min(16, Math.max(6.0, H * 0.016) + (level - 1) * 0.62);
        spawnSparks(ship.x, ship.y, "#f472b6", 28, 8);
        addPopup(W * 0.5, H * 0.34, "LEVEL " + level, "#f472b6");
        beep(480, 960, 0.26, "triangle", 0.13);
      }
      updateHUD();

      const gAcc = Math.max(1.25, H * 0.00185);
      ship.vy += ship.dir * gAcc;
      ship.y += ship.vy;
      ship.spin += ship.dir * 0.18;

      if (ship.y + ship.r >= botRail) { ship.y = botRail - ship.r; ship.vy = 0; }
      if (ship.y - ship.r <= topRail) { ship.y = topRail + ship.r; ship.vy = 0; }

      ship.tail.push({ x: ship.x, y: ship.y });
      if (ship.tail.length > 16) ship.tail.shift();

      const interval = Math.max(30, Math.floor(76 - level * 3.2));
      if (tick % interval === 0) spawnWave();

      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.x -= speed;

        if (h.kind === "mover") {
          h.y += h.vy;
          if (h.y <= h.minY || h.y >= h.maxY) h.vy *= -1;
          if (hitCircleRect(ship.x, ship.y, ship.r, h.x, h.y, h.w, h.h)) {
            onHazardHit(i); return;
          }
        } else if (h.kind === "laser") {
          h.phase += 0.095;
          h.hot = Math.sin(h.phase) > -0.1;
          if (h.hot && hitCircleRect(ship.x, ship.y, ship.r, h.x - h.w / 2, h.y - h.h / 2, h.w, h.h)) {
            onHazardHit(i); return;
          }
        } else {
          const hx = h.x + 6, hw = h.w - 12, hh = h.h - 8;
          const hy = h.top ? h.y : h.y - hh;
          if (hitCircleRect(ship.x, ship.y, ship.r, hx, hy, hw, hh)) {
            onHazardHit(i); return;
          }
        }
        if (h.x + 120 < 0) hazards.splice(i, 1);
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const pk = pickups[i];
        pk.x -= speed; pk.p += 0.14;
        if (Math.hypot(ship.x - pk.x, ship.y - pk.y) < ship.r + pk.r + 9) {
          if (pk.type === "shield") {
            setShieldUI(true);
            spawnSparks(pk.x, pk.y, "#38bdf8", 20, 7);
            addPopup(pk.x, pk.y - 16, "SHIELD!", "#38bdf8");
            beep(520, 1040, 0.2, "sine", 0.11);
          } else if (pk.type === "x2") {
            x2Timer = 360;
            setX2UI(true);
            spawnSparks(pk.x, pk.y, "#fbbf24", 20, 7);
            addPopup(pk.x, pk.y - 16, "2X!", "#fbbf24");
            beep(600, 1200, 0.22, "triangle", 0.12);
          } else {
            const pts = 50 * mult;
            score += pts;
            spawnSparks(pk.x, pk.y, "#fde047", 16, 6);
            addPopup(pk.x, pk.y - 14, "+" + pts, "#fde047");
            beep(720, 1140, 0.1, "sine", 0.1);
            updateHUD();
          }
          pickups.splice(i, 1); continue;
        }
        if (pk.x < -40) pickups.splice(i, 1);
      }
    }

    function drawSynthWorld() {
      // Synthwave Sky & Horizon Gradient
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#0f0524");
      sky.addColorStop(0.45, "#2b0d4a");
      sky.addColorStop(0.75, "#701a59");
      sky.addColorStop(1, "#16072b");
      ctx.fillStyle = sky;
      ctx.fillRect(-400, -400, W + 800, H + 800);

      // Retro Sun Disc in center-back
      const sunY = (topRail + botRail) * 0.52;
      const sunR = Math.min(W, botRail - topRail) * 0.24;
      const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
      sunGrad.addColorStop(0, "#fde047");
      sunGrad.addColorStop(0.6, "#fb7185");
      sunGrad.addColorStop(1, "#c026d3");

      ctx.save();
      ctx.globalAlpha = 0.24;
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(W * 0.62, sunY, sunR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Stars
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        ctx.fillStyle = "rgba(253, 244, 255, " + s.a + ")";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
        ctx.fill();
      }

      // Perspective Grid Floor inside track
      ctx.strokeStyle = "rgba(232, 121, 249, 0.14)";
      ctx.lineWidth = 1;
      for (let x = -railScroll - 300; x < W + 300; x += 36) {
        ctx.beginPath();
        ctx.moveTo(x, topRail);
        ctx.lineTo(x + 36, botRail);
        ctx.stroke();
      }

      // Top & Bottom Double Synth Rails with moving chevrons
      function drawRail(yPos, isTop) {
        ctx.save();
        ctx.fillStyle = "#1e0b36";
        ctx.fillRect(-400, isTop ? yPos - 8 : yPos, W + 800, 8);

        ctx.strokeStyle = isTop ? "#f472b6" : "#38bdf8";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 14;
        ctx.shadowColor = isTop ? "#f472b6" : "#38bdf8";
        ctx.beginPath();
        ctx.moveTo(-400, yPos);
        ctx.lineTo(W + 400, yPos);
        ctx.stroke();

        // Moving dashes along rail
        ctx.shadowBlur = 0;
        ctx.fillStyle = isTop ? "#fbcfe8" : "#bae6fd";
        for (let x = -railScroll - 300; x < W + 300; x += 36) {
          ctx.fillRect(x, isTop ? yPos - 5 : yPos + 2, 14, 3);
        }
        ctx.restore();
      }

      drawRail(topRail, true);
      drawRail(botRail, false);
    }

    function draw() {
      ctx.save();
      const cx = W / 2, cy = H / 2;
      ctx.translate(cx + panX, cy + panY);
      ctx.scale(zoom, zoom);
      ctx.translate(-cx, -cy);

      if (shake > 0) {
        const m = shake * 0.55;
        ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
      }

      drawSynthWorld();

      // Pickups
      for (let i = 0; i < pickups.length; i++) {
        const pk = pickups[i];
        const g = pk.r + Math.sin(pk.p) * 3;
        ctx.save();
        ctx.translate(pk.x, pk.y);
        if (pk.type === "shield") {
          ctx.strokeStyle = "#38bdf8";
          ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(0, 0, g, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (pk.type === "x2") {
          ctx.strokeStyle = "#fbbf24";
          ctx.fillStyle = "rgba(251, 191, 36, 0.25)";
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(0, 0, g, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#fef08a";
          ctx.font = "bold 10px sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("2X", 0, 1);
        } else {
          ctx.rotate(pk.p);
          ctx.strokeStyle = "#fde047";
          ctx.fillStyle = "rgba(253, 224, 71, 0.35)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, -g); ctx.lineTo(g, 0); ctx.lineTo(0, g); ctx.lineTo(-g, 0);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      }

      // Hazards with inner highlight
      for (let i = 0; i < hazards.length; i++) {
        const h = hazards[i];
        ctx.save();
        if (h.kind === "mover") {
          ctx.fillStyle = "#e11d48";
          ctx.fillRect(h.x, h.y, h.w, h.h);
          ctx.fillStyle = "#fda4af";
          ctx.fillRect(h.x + 5, h.y + 5, h.w - 10, h.h - 10);
        } else if (h.kind === "laser") {
          if (h.hot) {
            ctx.fillStyle = "#fb7185";
            ctx.fillRect(h.x - h.w / 2, h.y - h.h / 2, h.w, h.h);
            ctx.fillStyle = "#fff1f2";
            ctx.fillRect(h.x - 3, h.y - h.h / 2 + 4, 6, h.h - 8);
          } else {
            ctx.strokeStyle = "rgba(251, 113, 133, 0.55)";
            ctx.lineWidth = 2;
            ctx.strokeRect(h.x - h.w / 2, h.y - h.h / 2, h.w, h.h);
          }
        } else {
          ctx.fillStyle = "#e11d48";
          ctx.beginPath();
          if (h.top) {
            ctx.moveTo(h.x, h.y); ctx.lineTo(h.x + h.w / 2, h.y + h.h); ctx.lineTo(h.x + h.w, h.y);
          } else {
            ctx.moveTo(h.x, h.y); ctx.lineTo(h.x + h.w / 2, h.y - h.h); ctx.lineTo(h.x + h.w, h.y);
          }
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }

      // Tail
      for (let i = 0; i < ship.tail.length; i++) {
        const t = ship.tail[i];
        const ratio = (i + 1) / ship.tail.length;
        ctx.fillStyle = "rgba(244, 114, 182, " + (ratio * 0.35) + ")";
        ctx.beginPath();
        ctx.arc(t.x - (ship.tail.length - i) * 2.4, t.y, ship.r * ratio * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }

      // Player Cyber Core + Rotating Outer Ring
      if (state !== "OVER") {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.spin);

        ctx.strokeStyle = "#f472b6";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, ship.r + 4, 0, Math.PI * 1.35);
        ctx.stroke();

        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(0, 0, ship.r * 0.78, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, 0, ship.r * 0.34, 0, Math.PI * 2);
        ctx.fill();

        if (ship.shield) {
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, ship.r + 10, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      for (let i = 0; i < sparks.length; i++) {
        const s = sparks[i];
        ctx.fillStyle = s.color;
        ctx.globalAlpha = Math.max(0, s.life);
        ctx.fillRect(s.x, s.y, s.sz, s.sz);
      }
      ctx.globalAlpha = 1;

      for (let i = 0; i < popups.length; i++) {
        const p = popups[i];
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.font = "bold 16px Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(p.txt, p.x, p.y);
        ctx.restore();
      }

      if (flash > 0) {
        ctx.fillStyle = "rgba(253, 244, 255, " + flash + ")";
        ctx.fillRect(-400, -400, W + 800, H + 800);
      }
      ctx.restore();

      if (state === "START") {
        drawBanner("GRAVITY SYNTH v6", "Tap = Flip • 2 Fingers = Zoom • Endless Levels", "TAP TO PLAY");
      } else if (state === "OVER") {
        drawBanner("GAME OVER", "SCORE: " + Math.floor(score) + " • LEVEL " + level, "TAP TO RETRY");
      }
    }

    function drawBanner(title, line1, line2) {
      ctx.fillStyle = "rgba(18, 6, 36, 0.74)";
      ctx.fillRect(0, 0, W, H);
      const bw = Math.min(410, W * 0.88);
      const bh = 180;
      const bx = (W - bw) / 2;
      const by = (H - bh) / 2;

      ctx.fillStyle = "rgba(36, 12, 66, 0.96)";
      ctx.strokeStyle = "#f472b6";
      ctx.lineWidth = 2;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeRect(bx, by, bw, bh);

      ctx.textAlign = "center";
      ctx.fillStyle = "#fdf4ff";
      ctx.font = "800 22px Segoe UI, sans-serif";
      ctx.fillText(title, W / 2, by + 54);

      ctx.fillStyle = "#f5d0fe";
      ctx.font = "600 13px Segoe UI, sans-serif";
      ctx.fillText(line1, W / 2, by + 94);

      ctx.fillStyle = "#7dd3fc";
      ctx.font = "800 14px Segoe UI, sans-serif";
      ctx.fillText(line2, W / 2, by + 136);
    }

    // --- Touch: 1 Finger = Flip, 2 Fingers = Pinch Zoom & Pan ---
    const touches = new Map();
    let pinchStartDist = null;
    let pinchStartZoom = 1.0;
    let midPrevX = null;
    let midPrevY = null;

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        touches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      if (touches.size === 2) {
        const pts = Array.from(touches.values());
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartZoom = zoom;
        midPrevX = (pts[0].x + pts[1].x) / 2;
        midPrevY = (pts[0].y + pts[1].y) / 2;
      } else if (touches.size === 1) {
        flipDir();
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (touches.has(t.identifier)) {
          touches.set(t.identifier, { x: t.clientX, y: t.clientY });
        }
      }
      if (touches.size === 2 && pinchStartDist) {
        const pts = Array.from(touches.values());
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchStartZoom * (d / pinchStartDist)));
        syncZoomBtn();

        const mx = (pts[0].x + pts[1].x) / 2;
        const my = (pts[0].y + pts[1].y) / 2;
        if (midPrevX !== null && midPrevY !== null) {
          panX += mx - midPrevX;
          panY += my - midPrevY;
        }
        midPrevX = mx;
        midPrevY = my;
      }
    }, { passive: false });

    function releaseTouch(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        touches.delete(e.changedTouches[i].identifier);
      }
      if (touches.size < 2) {
        pinchStartDist = null;
        midPrevX = null;
        midPrevY = null;
      }
    }

    canvas.addEventListener("touchend", releaseTouch, { passive: false });
    canvas.addEventListener("touchcancel", releaseTouch, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 0 && touches.size === 0) flipDir();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") {
        e.preventDefault();
        flipDir();
      }
    });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
